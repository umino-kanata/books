<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>My Collection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MY COLLECTION</div>
        <h1 id="pageTitle">本・雑誌</h1>
      </div>
      <button id="backupBtn" class="icon-btn" aria-label="バックアップ">⇩</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="media-grid">
          <button class="media-card active" data-media="book"><span>📚</span><strong>本・雑誌</strong></button>
          <button class="media-card" data-media="cd"><span>💿</span><strong>CD</strong></button>
          <button class="media-card" data-media="dvd"><span>📀</span><strong>DVD</strong></button>
          <button class="media-card" data-media="bluray"><span>🔵</span><strong>Blu-ray</strong></button>
          <button class="media-card" data-media="vhs"><span>📼</span><strong>VHS</strong></button>
          <button class="media-card" data-media="digital"><span>☁️</span><strong>デジタル</strong></button>
        </div>

        <div class="search-panel">
          <input id="searchInput" type="search" placeholder="タイトル・著者を検索" />
          <select id="categoryFilter"><option value="">すべてのカテゴリー</option></select>
          <div class="chips">
            <button id="unreadFilter" class="chip">未読</button>
            <button id="favoriteFilter" class="chip">♥ お気に入り</button>
          </div>
        </div>

        <div class="section-head">
          <h2>作品一覧</h2>
          <span id="resultCount">0件</span>
        </div>
        <div id="itemList" class="item-list"></div>
      </section>

      <section id="formView" class="view">
        <div class="form-head">
          <button id="backBtn" class="text-btn">← 戻る</button>
          <h2 id="formTitle">作品を登録</h2>
        </div>
        <form id="itemForm">
          <input type="hidden" id="itemId" />

          <label>メディア
            <select id="mediaType">
              <option value="book">本・雑誌</option>
              <option value="cd">CD</option>
              <option value="dvd">DVD</option>
              <option value="bluray">Blu-ray</option>
              <option value="vhs">VHS</option>
              <option value="digital">デジタル</option>
            </select>
          </label>

          <label>タイトル <span class="required">必須</span>
            <input id="title" required />
          </label>

          <label>著者・アーティスト・出演者
            <input id="creator" placeholder="複数は「、」区切りでもOK" />
          </label>

          <div class="two-col">
            <label>シリーズ
              <input id="series" />
            </label>
            <label>巻数・巻名
              <input id="volume" />
            </label>
          </div>

          <label>カテゴリー
            <div id="categoryChecks" class="check-grid"></div>
            <div class="inline-add">
              <input id="newCategory" placeholder="カテゴリー追加" />
              <button type="button" id="addCategoryBtn">追加</button>
            </div>
          </label>

          <div class="toggle-row">
            <label class="toggle-line"><input id="favorite" type="checkbox" /> ♥ お気に入り</label>
            <label class="toggle-line"><input id="unread" type="checkbox" /> 未読</label>
          </div>

          <fieldset>
            <legend>所有</legend>
            <label class="toggle-line"><input id="owned" type="checkbox" checked /> 所有している</label>
            <div id="ownedFields">
              <label>形態
                <div class="check-grid compact">
                  <label><input type="checkbox" name="format" value="単行本" />単行本</label>
                  <label><input type="checkbox" name="format" value="文庫" />文庫</label>
                  <label><input type="checkbox" name="format" value="新書" />新書</label>
                  <label><input type="checkbox" name="format" value="電子書籍" />電子書籍</label>
                  <label><input type="checkbox" name="format" value="その他" />その他</label>
                </div>
              </label>
              <label>保管場所
                <input id="location" placeholder="例：自宅・本棚① / 会社・ロッカー" />
              </label>
              <label>貸出状態
                <select id="loanStatus">
                  <option value="">手元にある</option>
                  <option value="貸出中">貸出中</option>
                </select>
              </label>
              <label id="loanToWrap" class="hidden">貸した相手
                <input id="loanTo" />
              </label>
            </div>
            <div id="notOwnedFields" class="hidden">
              <label>状態
                <select id="notOwnedReason">
                  <option value="未購入">未購入</option>
                  <option value="購入予定">購入予定</option>
                  <option value="予約済み">予約済み</option>
                  <option value="借りている">借りている</option>
                  <option value="売却">売却</option>
                  <option value="贈呈">贈呈</option>
                  <option value="譲渡">譲渡</option>
                  <option value="廃棄">廃棄</option>
                  <option value="紛失">紛失</option>
                  <option value="その他">その他</option>
                </select>
              </label>
            </div>
          </fieldset>

          <details>
            <summary>詳細情報（任意）</summary>
            <div class="details-body">
              <label>ISBN / JAN
                <input id="isbn" />
              </label>
              <label>出版社・発売元
                <input id="publisher" />
              </label>
              <label>レーベル
                <input id="labelName" />
              </label>
              <label>利用サービス（Kobo等）
                <input id="service" />
              </label>
              <label>感想・書評
                <textarea id="review" rows="5"></textarea>
              </label>
              <label>メモ
                <textarea id="memo" rows="3"></textarea>
              </label>
            </div>
          </details>

          <div class="form-actions">
            <button type="submit" class="primary">保存</button>
            <button type="button" id="deleteBtn" class="danger hidden">削除</button>
          </div>
        </form>
      </section>
    </main>

    <button id="addBtn" class="fab" aria-label="登録">＋</button>

    <dialog id="backupDialog">
      <form method="dialog" class="dialog-card">
        <h3>バックアップ</h3>
        <p>端末に保存し、Google Driveなどにも保管してください。</p>
        <button type="button" id="exportBtn" class="primary">バックアップ作成</button>
        <label class="file-btn">バックアップから復元
          <input id="importInput" type="file" accept="application/json" />
        </label>
        <button>閉じる</button>
      </form>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
