<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>My Collection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">MY COLLECTION</div><h1 id="pageTitle">本</h1></div>
      <button id="backupBtn" class="icon-btn" aria-label="バックアップ">⇩</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="media-grid">
          <button class="media-card active" data-shelf="book"><span>📚</span><strong>本</strong></button>
          <button class="media-card developing" data-shelf="cd"><span>💿</span><strong>CD</strong><small>開発中</small></button>
          <button class="media-card developing" data-shelf="video"><span>🎬</span><strong>映像</strong><small>開発中</small></button>
          <button class="media-card developing" data-shelf="custom"><span>＋</span><strong>マイコレクション</strong><small>開発中</small></button>
        </div>

        <div class="search-panel">
          <input id="searchInput" type="search" placeholder="タイトル・著者を検索" />
          <div class="filter-row">
            <select id="categoryFilter"><option value="">すべてのカテゴリー</option></select>
            <button id="manageCategoryBtn" class="small-btn" type="button">編集</button>
          </div>
          <div class="chips">
            <button id="unreadFilter" class="chip">未読</button>
            <button id="favoriteFilter" class="chip">♥ お気に入り</button>
          </div>
        </div>

        <div class="section-head"><h2>作品一覧</h2><span id="resultCount">0件</span></div>
        <div id="itemList" class="item-list"></div>
      </section>

      <section id="formView" class="view">
        <div class="form-head"><button id="backBtn" class="text-btn">← 戻る</button><h2 id="formTitle">作品を登録</h2></div>
        <form id="itemForm">
          <input type="hidden" id="itemId" />

          <label>種類
            <select id="bookType">
              <option value="書籍">書籍</option>
              <option value="雑誌">雑誌</option>
              <option value="コミック">コミック</option>
            </select>
          </label>

          <label>タイトル <span class="required">必須</span><input id="title" required /></label>

          <div class="field-label-row"><span>著者・関係者</span><button type="button" id="addContributorBtn" class="small-btn">＋ 行追加</button></div>
          <div id="contributors"></div>

          <div class="two-col">
            <label>シリーズ<input id="series" /></label>
            <label>巻数・巻名<input id="volume" /></label>
          </div>

          <label>カテゴリー
            <div id="categoryChecks" class="check-grid"></div>
            <div class="inline-add"><input id="newCategory" placeholder="カテゴリー追加" /><button type="button" id="addCategoryBtn">追加</button></div>
          </label>

          <div class="toggle-row">
            <label class="toggle-line"><input id="favorite" type="checkbox" /> ♥ お気に入り</label>
            <label class="toggle-line"><input id="unread" type="checkbox" /> 未読</label>
          </div>

          <fieldset>
            <legend>所有</legend>
            <div class="toggle-row ownership-row">
              <label class="toggle-line"><input id="owned" type="checkbox" checked /> 所有している</label>
              <label id="loanToggleWrap" class="toggle-line"><input id="loaned" type="checkbox" /> 貸出中</label>
            </div>
            <div id="ownedFields">
              <label>形態
                <div class="check-grid compact">
                  <label><input type="checkbox" name="format" value="単行本" />単行本</label>
                  <label><input type="checkbox" name="format" value="文庫" />文庫</label>
                  <label><input type="checkbox" name="format" value="新書" />新書</label>
                  <label><input type="checkbox" name="format" value="電子書籍" />電子書籍</label>
                  <label><input type="checkbox" name="format" value="その他" />その他</label>
                </div>
              </label>
              <div class="filter-row location-row">
                <label class="grow">保管場所<select id="location"><option value="">未設定</option></select></label>
                <button id="manageLocationBtn" class="small-btn align-bottom" type="button">場所を登録</button>
              </div>
              <label id="loanMemoWrap" class="hidden">貸出先・メモ<input id="loanMemo" placeholder="例：○○さん／返却期限など" /></label>
            </div>
            <div id="notOwnedFields" class="hidden">
              <label>状態<select id="notOwnedReason"><option value="未購入">未購入</option><option value="購入予定">購入予定</option><option value="予約済み">予約済み</option><option value="借りている">借りている</option><option value="売却">売却</option><option value="贈呈">贈呈</option><option value="譲渡">譲渡</option><option value="廃棄">廃棄</option><option value="紛失">紛失</option><option value="その他">その他</option></select></label>
            </div>
          </fieldset>

          <details open>
            <summary>書籍情報（任意）</summary>
            <div class="details-body">
              <label>ISBN
                <div class="isbn-row"><input id="isbn" inputmode="numeric" placeholder="978..." /><button type="button" id="isbnLookupBtn" class="small-btn">ISBN検索</button><button type="button" id="scanBtn" class="small-btn">📷 読み取る</button></div>
                <small id="isbnMessage" class="hint"></small>
              </label>
              <label>出版社<input id="publisher" /></label>
              <label>レーベル<input id="labelName" /></label>
              <label>発行・発売日<input id="publishedDate" /></label>
              <label>感想・書評<textarea id="review" rows="5"></textarea></label>
              <label>メモ<textarea id="memo" rows="3"></textarea></label>
            </div>
          </details>

          <div class="form-actions"><button type="submit" class="primary">保存</button><button type="button" id="deleteBtn" class="danger hidden">削除</button></div>
        </form>
      </section>
    </main>

    <button id="addBtn" class="fab" aria-label="登録"><span>＋</span> 登録</button>

    <dialog id="categoryDialog"><div class="dialog-card"><h3>カテゴリー管理</h3><p>名前変更・並び替え・非表示ができます。</p><div id="categoryManager" class="manager-list"></div><div class="dialog-actions"><button type="button" id="closeCategoryDialog">閉じる</button></div></div></dialog>

    <dialog id="locationDialog"><div class="dialog-card"><h3>保管場所</h3><div class="inline-add"><input id="newLocation" placeholder="例：自宅・本棚①" /><button type="button" id="addLocationBtn">追加</button></div><div id="locationManager" class="manager-list"></div><div class="dialog-actions"><button type="button" id="closeLocationDialog">閉じる</button></div></div></dialog>

    <dialog id="scannerDialog"><div class="dialog-card scanner-card"><h3>ISBNバーコードを読み取る</h3><p>978 または 979 で始まるバーコードを読み取ります。</p><div id="reader"></div><button type="button" id="closeScannerBtn">閉じる</button></div></dialog>

    <dialog id="backupDialog"><div class="dialog-card"><h3>バックアップ</h3><p>端末に保存し、Google Driveなどにも保管してください。</p><button type="button" id="exportBtn" class="primary">バックアップ作成</button><label class="file-btn">バックアップから復元<input id="importInput" type="file" accept="application/json" /></label><button type="button" id="closeBackupBtn">閉じる</button></div></dialog>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
